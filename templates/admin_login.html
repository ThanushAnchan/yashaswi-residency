<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Yashaswi Residency Home Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
/* ==========================================================================
   YASHASWI RESIDENCY HOME STAY - LUXURY DESIGN SYSTEM
   Palette: Deep Royal Coastal Blue (#0f2b48), Warm Sandalwood Gold (#c69255),
   Teak Wood (#8d5b2c), Warm Ivory/Alabaster (#fcfbf8, #f5f2eb)
   ========================================================================== */

:root {
  --primary: #0f2b48;
  --primary-light: #183e69;
  --primary-dark: #091a2d;
  --accent: #c69255;
  --accent-hover: #b37f44;
  --accent-light: #f7ede2;
  --wood: #8d5b2c;
  --wood-light: #e6ccb2;

  --bg-main: #fcfbf8;
  --bg-card: rgba(255, 255, 255, 0.85);
  --bg-glass: rgba(255, 255, 255, 0.72);
  --bg-dark-glass: rgba(15, 43, 72, 0.88);

  --text-main: #1e293b;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --text-inverse: #ffffff;

  --border: rgba(226, 232, 240, 0.8);
  --border-glass: rgba(255, 255, 255, 0.4);
  --border-gold: rgba(198, 146, 85, 0.3);

  --shadow-sm: 0 2px 8px rgba(15, 43, 72, 0.05);
  --shadow-md: 0 8px 24px rgba(15, 43, 72, 0.08);
  --shadow-lg: 0 16px 40px rgba(15, 43, 72, 0.12);
  --shadow-3d: 0 20px 48px -12px rgba(15, 43, 72, 0.22);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 30px;
  --radius-full: 9999px;

  --font-heading: 'Cinzel', 'Playfair Display', serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

  --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-smooth: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-slow: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: var(--font-body);
  color: var(--text-main);
  background-color: var(--bg-main);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* --- Typography --- */
h1, h2, h3, h4, .font-heading {
  font-family: var(--font-heading);
  color: var(--primary);
  font-weight: 600;
  letter-spacing: 0.02em;
}

h1 { font-size: clamp(2.4rem, 5vw, 4.2rem); line-height: 1.15; }
h2 { font-size: clamp(1.8rem, 3.5vw, 2.75rem); line-height: 1.25; }
h3 { font-size: clamp(1.3rem, 2.5vw, 1.75rem); line-height: 1.35; }
h4 { font-size: 1.15rem; }

p {
  color: var(--text-muted);
  font-size: 1rem;
}

a {
  color: inherit;
  text-decoration: none;
  transition: color var(--transition-fast);
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

.container {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* --- Section Styling --- */
.section {
  padding: 6rem 0;
  position: relative;
}

.section-title-wrap {
  text-align: center;
  max-width: 720px;
  margin: 0 auto 3.5rem;
}

.section-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 1.1rem;
  background: var(--accent-light);
  color: var(--wood);
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  border-radius: var(--radius-full);
  margin-bottom: 1rem;
  border: 1px solid var(--border-gold);
}

.section-subtitle {
  font-size: 1.1rem;
  margin-top: 1rem;
  color: var(--text-muted);
}

/* --- Buttons --- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  padding: 0.85rem 1.85rem;
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  border-radius: var(--radius-full);
  cursor: pointer;
  border: 2px solid transparent;
  transition: all var(--transition-smooth);
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--wood) 100%);
  color: #fff;
  box-shadow: 0 6px 20px rgba(198, 146, 85, 0.35);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(198, 146, 85, 0.45);
  background: linear-gradient(135deg, #d39f62 0%, #996434 100%);
}

.btn-outline-white {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(10px);
}

.btn-outline-white:hover {
  background: #fff;
  color: var(--primary);
  border-color: #fff;
  transform: translateY(-2px);
}

.btn-outline-dark {
  background: transparent;
  color: var(--primary);
  border-color: var(--primary);
}

.btn-outline-dark:hover {
  background: var(--primary);
  color: #fff;
  transform: translateY(-2px);
}

.btn-sm {
  padding: 0.55rem 1.25rem;
  font-size: 0.85rem;
}

/* --- Glassmorphism Cards --- */
.glass-card {
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  transition: all var(--transition-smooth);
}

.glass-card:hover {
  box-shadow: var(--shadow-3d);
}

/* ==========================================================================
   NAVIGATION BAR
   ========================================================================== */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 1.25rem 0;
  transition: all var(--transition-smooth);
}

.navbar.scrolled {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  padding: 0.85rem 0;
  border-bottom: 1px solid rgba(226, 232, 240, 0.8);
  box-shadow: 0 4px 20px rgba(15, 43, 72, 0.06);
}

.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.brand-symbol {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.4rem;
  font-family: var(--font-heading);
  box-shadow: 0 4px 12px rgba(15, 43, 72, 0.2);
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-family: var(--font-heading);
  font-size: 1.35rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.04em;
  line-height: 1.1;
  transition: color var(--transition-fast);
}

.navbar.scrolled .brand-name {
  color: var(--primary);
}

.brand-sub {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
}

.nav-menu {
  display: flex;
  align-items: center;
  gap: 2rem;
  list-style: none;
}

.nav-link {
  font-size: 0.95rem;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.88);
  position: relative;
  padding: 0.35rem 0;
}

.navbar.scrolled .nav-link {
  color: var(--text-main);
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0%;
  height: 2px;
  background: var(--accent);
  transition: width var(--transition-smooth);
}

.nav-link:hover {
  color: var(--accent);
}

.nav-link:hover::after {
  width: 100%;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.nav-mobile-toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.5rem;
  color: #fff;
  font-size: 1.6rem;
}

.navbar.scrolled .nav-mobile-toggle {
  color: var(--primary);
}

/* ==========================================================================
   HERO SECTION & 3D CANVAS
   ========================================================================== */
.hero-section {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8rem 0 5rem;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('/static/images/hero_exterior.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  transform: scale(1.03);
  transition: transform var(--transition-slow);
}

.hero-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    180deg,
    rgba(9, 26, 45, 0.65) 0%,
    rgba(15, 43, 72, 0.75) 50%,
    rgba(9, 26, 45, 0.9) 100%
  );
}

#hero-3d-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  opacity: 0.75;
}

.hero-content {
  position: relative;
  z-index: 5;
  text-align: center;
  max-width: 900px;
  margin: 0 auto;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.45rem 1.35rem;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #fff;
  font-size: 0.88rem;
  font-weight: 600;
  border-radius: var(--radius-full);
  margin-bottom: 1.5rem;
  letter-spacing: 0.05em;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.hero-title {
  color: #fff;
  font-size: clamp(2.6rem, 5.5vw, 4.8rem);
  line-height: 1.1;
  margin-bottom: 0.75rem;
  text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.hero-tagline {
  color: var(--accent);
  font-size: clamp(1.15rem, 2.2vw, 1.6rem);
  font-weight: 500;
  font-family: var(--font-heading);
  letter-spacing: 0.06em;
  margin-bottom: 1.25rem;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
}

.hero-desc {
  color: rgba(255, 255, 255, 0.9);
  font-size: clamp(1rem, 1.5vw, 1.15rem);
  max-width: 680px;
  margin: 0 auto 2.5rem;
  line-height: 1.7;
}

.hero-btn-group {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  flex-wrap: wrap;
  margin-bottom: 3.5rem;
}

/* --- Floating Booking Bar Card --- */
.floating-booking-card {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: var(--radius-xl);
  padding: 1.5rem 2rem;
  box-shadow: 0 24px 60px -12px rgba(9, 26, 45, 0.35);
  max-width: 1040px;
  margin: 0 auto;
}

.booking-form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) 1.2fr;
  gap: 1.25rem;
  align-items: end;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  text-align: left;
}

.form-label {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.form-control {
  width: 100%;
  padding: 0.8rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--text-main);
  background: #fff;
  transition: all var(--transition-fast);
  outline: none;
}

.form-control:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(198, 146, 85, 0.15);
}

/* ==========================================================================
   ABOUT SECTION
   ========================================================================== */
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
}

.about-image-wrapper {
  position: relative;
}

.about-image-main {
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-3d);
  width: 100%;
  height: 480px;
  object-fit: cover;
  transition: transform var(--transition-smooth);
}

.about-image-badge {
  position: absolute;
  bottom: -24px;
  right: -20px;
  background: #fff;
  padding: 1.5rem 2rem;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 1rem;
}

.about-badge-icon {
  width: 50px;
  height: 50px;
  background: var(--accent-light);
  color: var(--wood);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
}

.about-badge-text strong {
  display: block;
  font-size: 1.3rem;
  color: var(--primary);
  font-family: var(--font-heading);
}

.about-badge-text span {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.features-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.25rem;
  margin-top: 2rem;
}

.feature-pill {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 1.25rem;
  background: #fff;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-smooth);
}

.feature-pill:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
}

.feature-check {
  width: 24px;
  height: 24px;
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  flex-shrink: 0;
}

.feature-pill span {
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--primary);
}

/* ==========================================================================
   ROOMS SECTION & 3D TILT CARDS
   ========================================================================== */
.rooms-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 2.25rem;
}

.room-card {
  background: #fff;
  border-radius: var(--radius-xl);
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  transition: transform var(--transition-smooth), box-shadow var(--transition-smooth);
  display: flex;
  flex-direction: column;
  position: relative;
}

.room-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-3d);
}

.room-image-wrap {
  position: relative;
  height: 270px;
  overflow: hidden;
}

.room-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform var(--transition-slow);
}

.room-card:hover .room-img {
  transform: scale(1.08);
}

.room-price-badge {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: rgba(15, 43, 72, 0.88);
  backdrop-filter: blur(10px);
  color: #fff;
  padding: 0.5rem 1rem;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 700;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.room-price-badge span {
  color: var(--accent);
  font-size: 1.15rem;
}

.room-content {
  padding: 2rem;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.room-capacity {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  color: var(--wood);
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.room-title {
  font-size: 1.5rem;
  margin-bottom: 0.75rem;
  color: var(--primary);
}

.room-desc {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 1.25rem;
  flex-grow: 1;
}

.room-amenities-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}

.amenity-tag {
  font-size: 0.78rem;
  padding: 0.3rem 0.75rem;
  background: #f1f5f9;
  border-radius: var(--radius-full);
  color: var(--text-muted);
  font-weight: 500;
}

.room-card-footer {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
}

.room-card-footer .btn {
  flex: 1;
}

/* ==========================================================================
   AMENITIES SECTION
   ========================================================================== */
.amenities-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.75rem;
}

.amenity-card {
  background: #fff;
  padding: 2.25rem 1.75rem;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  text-align: center;
  transition: all var(--transition-smooth);
}

.amenity-card:hover {
  transform: translateY(-6px);
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
}

.amenity-icon-box {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, var(--accent-light) 0%, #fff 100%);
  color: var(--wood);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  margin: 0 auto 1.25rem;
  border: 1px solid var(--border-gold);
}

.amenity-card h4 {
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.amenity-card p {
  font-size: 0.88rem;
}

/* ==========================================================================
   GALLERY MASONRY & LIGHTBOX
   ========================================================================== */
.gallery-filter-bar {
  display: flex;
  justify-content: center;
  gap: 0.75rem;
  margin-bottom: 2.5rem;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 0.5rem 1.25rem;
  border-radius: var(--radius-full);
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-muted);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.filter-btn.active, .filter-btn:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 1.25rem;
}

.gallery-item {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  height: 320px;
}

.gallery-item.col-8 { grid-column: span 8; }
.gallery-item.col-4 { grid-column: span 4; }
.gallery-item.col-6 { grid-column: span 6; }

.gallery-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform var(--transition-slow);
}

.gallery-item:hover .gallery-img {
  transform: scale(1.06);
}

.gallery-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(9, 26, 45, 0.85) 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 1.5rem;
  opacity: 0;
  transition: opacity var(--transition-smooth);
}

.gallery-item:hover .gallery-overlay {
  opacity: 1;
}

.gallery-caption {
  color: #fff;
  font-weight: 600;
  font-size: 1.1rem;
}

.gallery-tag {
  color: var(--accent);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
}

/* Lightbox Modal */
.lightbox-modal {
  position: fixed;
  inset: 0;
  background: rgba(9, 26, 45, 0.95);
  backdrop-filter: blur(20px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.lightbox-modal.active {
  display: flex;
}

.lightbox-content {
  position: relative;
  max-width: 90vw;
  max-height: 85vh;
  text-align: center;
}

.lightbox-image {
  max-width: 100%;
  max-height: 75vh;
  border-radius: var(--radius-md);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

.lightbox-caption-text {
  color: #fff;
  margin-top: 1rem;
  font-size: 1.1rem;
  font-weight: 500;
}

.lightbox-close, .lightbox-nav {
  position: absolute;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #fff;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.4rem;
  transition: all var(--transition-fast);
}

.lightbox-close { top: 2rem; right: 2rem; }
.lightbox-prev { left: 2rem; top: 50%; transform: translateY(-50%); }
.lightbox-next { right: 2rem; top: 50%; transform: translateY(-50%); }

.lightbox-close:hover, .lightbox-nav:hover {
  background: var(--accent);
  color: #fff;
}

/* ==========================================================================
   REVIEWS SECTION
   ========================================================================== */
.review-stats-badge {
  display: inline-flex;
  align-items: center;
  gap: 1.25rem;
  padding: 1rem 2.25rem;
  background: #fff;
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-md);
  margin-bottom: 3rem;
  border: 1px solid var(--border);
}

.review-stars {
  color: #f59e0b;
  font-size: 1.25rem;
}

.review-score {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary);
  font-family: var(--font-heading);
}

.reviews-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 2rem;
}

.review-card {
  background: #fff;
  padding: 2.25rem;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  transition: transform var(--transition-smooth);
}

.review-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-md);
}

.review-card-stars {
  color: #f59e0b;
  margin-bottom: 1rem;
}

.review-quote {
  font-style: italic;
  font-size: 0.98rem;
  color: var(--text-main);
  line-height: 1.7;
  margin-bottom: 1.5rem;
  flex-grow: 1;
}

.reviewer-meta {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  border-top: 1px solid var(--border);
  padding-top: 1rem;
}

.reviewer-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--accent-light);
  color: var(--wood);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.reviewer-name {
  font-weight: 700;
  color: var(--primary);
}

.reviewer-date {
  font-size: 0.8rem;
  color: var(--text-light);
}

/* ==========================================================================
   LOCATION SECTION
   ========================================================================== */
.location-card-grid {
  display: grid;
  grid-template-columns: 1fr 1.25fr;
  gap: 3rem;
  background: #fff;
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}

.location-info-panel {
  padding: 3.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.location-detail-item {
  display: flex;
  gap: 1.25rem;
  margin-bottom: 1.75rem;
}

.location-icon-circle {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--accent-light);
  color: var(--wood);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}

.location-detail-item strong {
  display: block;
  font-size: 1rem;
  color: var(--primary);
  margin-bottom: 0.2rem;
}

.location-map-wrapper {
  position: relative;
  min-height: 420px;
}

.location-map-wrapper iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

/* ==========================================================================
   CTA BANNER SECTION
   ========================================================================== */
.cta-banner {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  border-radius: var(--radius-xl);
  padding: 4.5rem 3rem;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-3d);
}

.cta-banner h2 {
  color: #fff;
  margin-bottom: 1rem;
}

.cta-banner p {
  color: rgba(255, 255, 255, 0.85);
  font-size: 1.15rem;
  max-width: 640px;
  margin: 0 auto 2.5rem;
}

/* ==========================================================================
   FOOTER
   ========================================================================== */
.footer {
  background: #091a2d;
  color: #cbd5e1;
  padding: 5rem 0 2rem;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1.5fr;
  gap: 3.5rem;
  margin-bottom: 4rem;
}

.footer-brand h3 {
  color: #fff;
  margin-bottom: 0.5rem;
}

.footer-tagline {
  color: var(--accent);
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
}

.footer-links h4, .footer-contact h4 {
  color: #fff;
  margin-bottom: 1.25rem;
  font-size: 1.05rem;
}

.footer-links ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.footer-links a:hover {
  color: var(--accent);
}

.footer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 2rem;
  font-size: 0.88rem;
  color: #94a3b8;
}

.footer-admin-link {
  color: var(--accent);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

/* ==========================================================================
   MODALS (BOOKING, DETAILS, CONFIRMATION)
   ========================================================================== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(9, 26, 45, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 2500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  overflow-y: auto;
}

.modal-backdrop.active {
  display: flex;
}

.modal-box {
  background: #fff;
  border-radius: var(--radius-xl);
  max-width: 650px;
  width: 100%;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
  overflow: hidden;
  position: relative;
  animation: modalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalPop {
  from { opacity: 0; transform: scale(0.92) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  padding: 1.75rem 2rem;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
  position: relative;
}

.modal-header h3 {
  color: #fff;
  font-size: 1.45rem;
}

.modal-header p {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.88rem;
}

.modal-close-btn {
  position: absolute;
  top: 1.25rem;
  right: 1.5rem;
  background: rgba(255, 255, 255, 0.15);
  border: none;
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  transition: all var(--transition-fast);
}

.modal-close-btn:hover {
  background: #fff;
  color: var(--primary);
}

.modal-body {
  padding: 2rem;
  max-height: 75vh;
  overflow-y: auto;
}

/* Mobile Sticky Book Bar */
.mobile-sticky-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(14px);
  padding: 0.85rem 1.5rem;
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
  z-index: 999;
  align-items: center;
  justify-content: space-between;
}

.mobile-price-tag strong {
  display: block;
  font-size: 1.15rem;
  color: var(--primary);
}

.mobile-price-tag span {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* ==========================================================================
   RESPONSIVE MEDIA QUERIES
   ========================================================================== */
@media (max-width: 1024px) {
  .about-grid { grid-template-columns: 1fr; gap: 3rem; }
  .about-image-main { height: 380px; }
  .location-card-grid { grid-template-columns: 1fr; }
  .location-info-panel { padding: 2.5rem; }
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 2.5rem; }
}

@media (max-width: 768px) {
  .nav-menu {
    position: fixed;
    top: 70px;
    left: 0;
    right: 0;
    background: #fff;
    flex-direction: column;
    padding: 2rem;
    gap: 1.5rem;
    box-shadow: var(--shadow-lg);
    display: none;
    border-bottom: 2px solid var(--accent);
  }

  .nav-menu.active {
    display: flex;
  }

  .nav-menu .nav-link {
    color: var(--primary);
    font-size: 1.1rem;
  }

  .nav-mobile-toggle {
    display: block;
  }

  .nav-actions .btn {
    display: none;
  }

  .booking-form-grid {
    grid-template-columns: 1fr;
  }

  .features-grid {
    grid-template-columns: 1fr;
  }

  .gallery-item.col-8,
  .gallery-item.col-4,
  .gallery-item.col-6 {
    grid-column: span 12;
    height: 260px;
  }

  .footer-grid {
    grid-template-columns: 1fr;
    gap: 2rem;
  }

  .footer-bottom {
    flex-direction: column;
    gap: 1rem;
    text-align: center;
  }

  .mobile-sticky-bar {
    display: flex;
  }
}

/* Floating Feedback Button */
.floating-feedback-btn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--wood) 100%);

.floating-feedback-btn:hover {

  box-shadow: 0 12px 30px rgba(198, 146, 85, 0.6);
}

@media (max-width: 768px) {
  .floating-feedback-btn {
    bottom: 74px;

    padding: 0.55rem 1rem;
    font-size: 0.82rem;
  }

    body {
      background: linear-gradient(135deg, #091a2d 0%, #0f2b48 100%);

    .login-card {

      padding: 3rem 2.5rem;
      max-width: 440px;

      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .login-brand-symbol {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
      color: #fff;

      font-family: var(--font-heading);
      border-radius: 16px;

      box-shadow: 0 6px 18px rgba(15, 43, 72, 0.25);

<body>

  <div class="login-card">
    <div class="login-brand-symbol">Y</div>
    <h2 style="font-size: 1.6rem; color: var(--primary); margin-bottom: 0.3rem;">Owner Portal</h2>
    <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 2rem;">Yashaswi Residency Home Stay, Manipal</p>

    <div id="login-error" style="display: none; padding: 0.75rem 1rem; background: #fee2e2; color: #b91c1c; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1.25rem;"></div>

    <form id="admin-login-form" style="display: flex; flex-direction: column; gap: 1.2rem; text-align: left;">
      <div class="form-field">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="admin" required autofocus>
      </div>

      <div class="form-field">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="login-submit-btn">
        SECURE LOGIN
      </button>
    </form>

    <div style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.25rem;">
      <a href="/" style="font-size: 0.88rem; color: var(--wood); font-weight: 600;">← Back to Public Website</a>
    </div>
  </div>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-submit-btn');
      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim()
      };

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/admin/dashboard';
        } else {
          errBox.textContent = data.error || 'Invalid credentials.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Connection error. Please try again.';
        errBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'SECURE LOGIN';
      }
    });
  </script>
